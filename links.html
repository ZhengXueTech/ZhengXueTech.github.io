<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>短網址管理</title>
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="何政學">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 個人用管理頁：上面新增、中間清單、右邊（手機在下）QR code 與要貼回 GitHub 的清單 */
:root{
  --bg:#f5f6f3; --paper:#ffffff; --ink:#16212b; --mute:#58646f; --line:#d9ddd6; --soft:#eceee8;
  --accent:#d8901f; --accent-ink:#1b1305; --bad:#c0392b; --ok:#2e7d4f;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --paper:#182028; --ink:#e6eaee; --mute:#97a3ad; --line:#2a343d; --soft:#1e2730;
  --accent:#efa93a; --accent-ink:#1b1305; --bad:#f07a6b; --ok:#5fc38a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --paper:#182028; --ink:#e6eaee; --mute:#97a3ad; --line:#2a343d; --soft:#1e2730;
  --accent:#efa93a; --accent-ink:#1b1305; --bad:#f07a6b; --ok:#5fc38a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:24px;text-wrap:balance}
h1 small{display:block;font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--mute);letter-spacing:.08em;margin-top:2px}
h2{margin:0 0 10px;font-size:15px;color:var(--mute);font-weight:500;letter-spacing:.06em}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.form{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,2fr) auto;gap:8px;align-items:center}
.base{font-family:var(--f-mono);color:var(--mute);font-size:13px;white-space:nowrap}
input{font:inherit;font-family:var(--f-mono);font-size:14px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
button.pri:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg{min-height:22px;font-size:13px;margin-top:8px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--soft)}
.code{font-family:var(--f-mono);font-weight:500}
.to{font-family:var(--f-mono);font-size:12px;color:var(--mute);word-break:break-all}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.acts button{padding:4px 9px;font-size:13px}
.tbl{overflow-x:auto}
.qr{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qr img{width:220px;height:220px;max-width:100%;image-rendering:pixelated;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line)}
.qr .u{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
textarea{width:100%;min-height:200px;font-family:var(--f-mono);font-size:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--mute)}
.flag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);margin-left:6px;font-family:var(--f-body)}
@media (max-width:820px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.base{white-space:normal}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>短網址管理<small>zhengxuetech.github.io／代碼</small></h1>
  </header>

  <section class="panel">
    <h2>新增短網址</h2>
    <div class="form">
      <span class="base">zhengxuetech.github.io/</span>
      <input id="code" placeholder="代碼，例如 drone" autocomplete="off" spellcheck="false" aria-label="代碼">
      <input id="to" placeholder="要前往的完整網址 https://…" autocomplete="off" spellcheck="false" aria-label="目標網址">
      <button class="pri" id="add">加入清單</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>目前的短網址</h2>
      <div class="tbl"><table>
        <thead><tr><th>代碼</th><th>前往</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table></div>
      <p class="note">標「未上傳」的是這次新增、還沒貼回 GitHub 的；重新整理頁面就會消失。</p>
    </section>

    <aside class="panel qr" id="qrBox">
      <h2>QR code</h2>
      <img id="qrImg" alt="短網址的 QR code">
      <div class="u" id="qrUrl"></div>
      <div class="acts" style="justify-content:center">
        <button id="qrCopy">複製網址</button>
      </div>
      <p class="note">手機長按、電腦按右鍵就能把 QR code 存成圖片，放進簡報或講義。</p>
    </aside>
  </div>

  <section class="panel">
    <h2>貼回 GitHub 的新清單</h2>
    <textarea id="out" readonly aria-label="新的 links.js 內容"></textarea>
    <div class="acts" style="justify-content:flex-start;margin-top:8px"><button class="pri" id="copyOut">複製整份清單</button></div>
    <ol>
      <li>到 GitHub 的 zhengxuetech.github.io 打開 <span class="code">links.js</span>，按鉛筆圖示編輯。</li>
      <li>全選刪掉，貼上這份清單，按 Commit changes。</li>
      <li>等一兩分鐘，新的短網址就能用了。</li>
    </ol>
  </section>
</div>

<script src="links.js"></script>
<script src="lib/qrcode.js"></script>
<script>
const BASE = 'https://zhengxuetech.github.io/';
// 網站上真的有的資料夾或檔名，不能拿來當代碼
const RESERVED = ['xuesimaker', 'lib', 'links', 'links.html', 'links.js', 'index', 'index.html', '404', '404.html', 'photo.jpg', 'assets', 'readme', 'license',
  // 帳號裡已有的 repo（它們佔用了 zhengxuetech.github.io/名稱）；以後新增 repo 也要補進來
  'ccjhs-map', 'ccjhsmaker', 'drone-training_v2.2', 'drone-training_v2', 'drone-training', 'drone-simulator-v2', 'makerspace', 'gesture_system',
  'renaissance_selfie', 'renaissance-art-quiz_v2', 'renaissance-art-quiz', 'flipbook_tool', 'web-media-tools_2', 'web-media-tools_ii', 'web-media-tools',
  'desktop-tutorial', 'tetris', 'balance-toys'];
const saved = (typeof LINKS === 'object' && LINKS) ? LINKS : {};
const fresh = {};                 // 這次新增、還沒上傳的
let current = Object.keys(saved)[0] || null;
const $ = (id) => document.getElementById(id);
const all = () => Object.assign({}, saved, fresh);

function setMsg(t, kind) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (kind || ''); }

function render() {
  const tb = $('list'); tb.textContent = '';
  for (const [code, to] of Object.entries(all())) {
    const tr = document.createElement('tr'); if (code === current) tr.className = 'sel';
    const c = document.createElement('td'); c.className = 'code'; c.textContent = code;
    if (fresh[code]) { const f = document.createElement('span'); f.className = 'flag'; f.textContent = '未上傳'; c.appendChild(f); }
    const t = document.createElement('td'); t.className = 'to'; t.textContent = to;
    const a = document.createElement('td'); const box = document.createElement('div'); box.className = 'acts';
    const bQr = document.createElement('button'); bQr.textContent = 'QR'; bQr.onclick = () => { current = code; render(); };
    const bCp = document.createElement('button'); bCp.textContent = '複製'; bCp.onclick = () => copy(BASE + code, bCp);
    const bGo = document.createElement('a'); bGo.textContent = '測試'; bGo.href = to; bGo.target = '_blank'; bGo.rel = 'noopener';
    bGo.style.cssText = 'font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit';
    box.append(bQr, bCp, bGo);
    if (fresh[code]) { const bDel = document.createElement('button'); bDel.textContent = '移除'; bDel.onclick = () => { delete fresh[code]; if (current === code) current = Object.keys(all())[0] || null; render(); }; box.append(bDel); }
    a.appendChild(box); tr.append(c, t, a); tb.appendChild(tr);
  }
  renderQR(); renderOut();
}

function renderQR() {
  const img = $('qrImg'), u = $('qrUrl');
  if (!current) { img.removeAttribute('src'); u.textContent = '清單是空的'; return; }
  const url = BASE + current; u.textContent = url;
  if (typeof qrcode !== 'function') { u.textContent = url + '（QR 元件沒載入，請檢查網路）'; return; }
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  img.src = q.createDataURL(8, 2);
}

function renderOut() {
  const rows = Object.entries(all());
  const w = Math.max(0, ...rows.map(([c]) => c.length)) + 3;
  const lines = rows.map(([c, t]) => '  ' + (JSON.stringify(c) + ':').padEnd(w + 1) + ' ' + JSON.stringify(t) + ',');
  $('out').value = '// 短網址清單 ─ zhengxuetech.github.io/代碼 會跳到後面的網址\n'
    + '// 代碼只用小寫英文、數字和 -；新增一個短網址＝加一行\n'
    + '// 用 links.html 管理頁可以檢查重複、產生 QR code，並產生整份新清單\n'
    + 'const LINKS = {\n' + lines.join('\n') + '\n};\n';
}

function copy(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = '已複製'; setTimeout(() => btn.textContent = o, 1200); };
  try { navigator.clipboard.writeText(text).then(done, () => fallback(text, done)); } catch { fallback(text, done); }
}
function fallback(text, done) {
  const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch {} t.remove();
}

$('add').onclick = () => {
  const code = $('code').value.trim().toLowerCase(), to = $('to').value.trim();
  if (!code) return setMsg('先填代碼。', 'bad');
  if (!/^[a-z0-9-]{1,40}$/.test(code)) return setMsg('代碼只能用小寫英文、數字和 -，例如 drone-2026。', 'bad');
  if (RESERVED.includes(code)) return setMsg('「' + code + '」是網站上已有的資料夾或檔名，換一個代碼。', 'bad');
  if (all()[code]) return setMsg('代碼「' + code + '」已經用過了，前往 ' + all()[code], 'bad');
  if (!/^https?:\/\/\S+\.\S+/.test(to)) return setMsg('目標網址要是完整網址，開頭是 https://', 'bad');
  fresh[code] = to; current = code;
  $('code').value = ''; $('to').value = '';
  setMsg('已加入。記得複製下面的新清單貼回 GitHub。', 'ok'); render();
};
['code', 'to'].forEach((id) => $(id).addEventListener('input', () => setMsg('')));
$('to').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('add').click(); });
$('qrCopy').onclick = () => current && copy(BASE + current, $('qrCopy'));
$('copyOut').onclick = () => copy($('out').value, $('copyOut'));
render();
</script>

</body>
</html>
